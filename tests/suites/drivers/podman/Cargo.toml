# The package isn't named `podman` because the support crate it depends on is.
[package]
name = "podman-driver"
description = "Drivers suite: Podman driver behavior, such as user namespaces"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"
publish = false

[dependencies]
container-engine = { path = "../../../support/container-engine" }
openshell-testkit = { path = "../../../testkit/testkit" }
podman = { path = "../../../support/podman" }
